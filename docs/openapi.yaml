components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: cadence_session
  schemas:
    SyncOK:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    SyncAuthorization:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    SyncToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 16, maxLength: 256, writeOnly: true }
    SyncPreferences:
      type: object
      additionalProperties: false
      required: [plays, nowPlaying, likes]
      properties:
        plays: { type: boolean, default: true }
        nowPlaying: { type: boolean, default: true }
        likes: { type: boolean, default: false }
    SyncEvent:
      type: object
      additionalProperties: false
      required: [eventId, trackId, startedAt, heard, duration]
      properties:
        eventId: { type: string, minLength: 16, maxLength: 100, pattern: "^[0-9a-fA-F-]+$" }
        trackId: { type: string, minLength: 1, maxLength: 120 }
        startedAt:
          type: integer
          format: int64
          description: Original playback start in Unix seconds; at most 30 days old.
        heard:
          type: number
          minimum: 0
          maximum: 172800
          description: Actual listening seconds, excluding seek, pause, and buffering.
        duration:
          type: number
          minimum: 0
          maximum: 172800
          description: Seconds; server catalog duration takes precedence when known.
    SyncConnection:
      type: object
      properties:
        provider: { type: string, enum: [lastfm, listenbrainz] }
        username: { type: string }
        plays: { type: boolean }
        nowPlaying: { type: boolean }
        likes: { type: boolean }
        paused: { type: boolean }
        error: { type: string }
        lastSuccess: { type: string, format: date-time, nullable: true }
        pending: { type: integer }
        waitingFeedback: { type: integer, description: Like changes awaiting a ListenBrainz recording identifier. }
    SyncStatus:
      type: object
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/SyncConnection"
        lastfmConfigured: { type: boolean }
        lastfmAuthorizationAvailable: { type: boolean }
    SyncExportRange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { type: string, format: date-time, description: Inclusive start. }
        to: { type: string, format: date-time, description: Exclusive end. }
    SyncExport:
      type: object
      properties:
        id: { type: string, description: Empty for a preview. }
        eligible: { type: integer }
        previouslySent: { type: integer }
        excluded: { type: integer }
        pending: { type: integer }
        sent: { type: integer }
        rejected: { type: integer }
        cancelled: { type: integer }
        failures:
          type: array
          maxItems: 25
          items:
            type: object
            properties:
              title: { type: string }
              artist: { type: string }
              error: { type: string }
    LibrarySummary:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    MusicLibraryInput:
      type: object
      required:
        - name
        - folders
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        folders:
          type: array
          items: &a1
            type: string
          minItems: 1
          maxItems: 100
        everyone:
          type: boolean
          default: false
        users: &a2
          type: array
          items: *a1
        groups: *a2
    MusicLibrary:
      allOf:
        - $ref: "#/components/schemas/MusicLibraryInput"
        - $ref: "#/components/schemas/LibrarySummary"
    MusicFolderPage:
      type: object
      properties:
        path:
          type: string
        parent:
          type: string
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              path:
                type: string
    ArtistProfile:
      type: object
      properties:
        name:
          type: string
        mbid:
          type: string
        type:
          type: string
        country:
          type: string
        description:
          type: string
        biography:
          type: string
        image:
          type: string
        imageSource:
          type: string
        wikipedia:
          type: string
        warning:
          type: string
        updated:
          type: string
          format: date-time
        genres:
          type: array
          items:
            type: string
        links:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              url:
                type: string
                format: uri
    PlaybackCheckpoint:
      type: object
      required: [trackId, position, revision, writer, sequence]
      properties:
        trackId:
          type: string
          maxLength: 120
        position:
          type: number
          minimum: 0
          maximum: 172800
          description: Playback position in seconds
        revision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        writer:
          type: string
          pattern: "^([a-f0-9-]{16,64})?$"
        sequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Positive and increasing for saves; zero for an empty saved state
    OK:
      type: object
      properties:
        ok:
          type: boolean
    Error:
      type: object
      properties:
        error:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
          description: Unique lowercase sign-in name
        displayName:
          type: string
        admin:
          type: boolean
        groups:
          type: array
          items:
            type: string
        avatar:
          type: boolean
          description: Whether a stored avatar is available
        avatarVersion:
          type: integer
          format: int64
          description: Increases on avatar replacement or removal
    Session:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrf:
          type: string
    Track:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        featuredArtists:
          type: string
          description: Comma-separated featured performers.
        videoGuests:
          type: string
          description: Comma-separated music video appearance credits.
        albumArtist:
          type: string
          description: Omitted for singles.
        album:
          type: string
          description: Omitted when the song has no album.
        albumId:
          type: string
          description: Omitted for singles.
        single:
          type: boolean
          description: True when the song has no album metadata.
        year:
          type: string
        genre:
          type: string
        codec:
          type: string
        mime:
          type: string
        number:
          type: integer
        disc:
          type: integer
        duration:
          type: number
        artwork:
          type: boolean
        liked:
          type: boolean
    Page:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
    Album:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        tracks:
          type: integer
        coverId:
          type: string
    Artist:
      type: object
      properties:
        image:
          type: string
        name:
          type: string
        tracks:
          type: integer
    Playlist:
      type: object
      properties:
        icon:
          type: string
          enum: [music, heart, headphones, disc, sparkles, moon]
        id:
          type: string
        name:
          type: string
    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Exclusion:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        kind:
          type: string
        target:
          type: string
    Suggestion:
      type: object
      properties:
        id:
          type: string
        trackId:
          type: string
        field:
          type: string
        value:
          type: string
        source:
          type: string
        status:
          type: string
        title:
          type: string
        current:
          type: string
    Scan:
      type: object
      properties:
        id:
          type: string
        started:
          type: string
          format: date-time
        finished:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        indexed:
          type: integer
        errors:
          type: array
          items:
            type: string

    SoulseekCapabilities:
      type: object
      properties:
        losslessOnly:
          type: boolean
          default: true
          description: Require reported sample rate and bit depth; verify actual lossless codec before import.
        allowedFormats:
          type: array
          minItems: 1
          uniqueItems: true
          default: [flac, wav, m4a, mp3, aac, ogg, opus]
          items:
            type: string
            enum: [flac, wav, m4a, mp3, aac, ogg, opus]
        configured:
          type: boolean
        enabled:
          type: boolean
        allowed:
          type: boolean
        presentation:
          type: string
          enum:
            - separate
            - combined
    SoulseekRule:
      type: object
      required:
        - mode
      properties:
        subject: &a1
          type: string
        mode:
          type: string
          enum:
            - review
            - auto
        libraryId: *a1
        folder: *a1
    SoulseekSettings:
      type: object
      required:
        - enabled
        - presentation
        - reviewTiming
        - default
        - sharing
      properties:
        losslessOnly:
          type: boolean
          default: true
          description: Require reported sample rate and bit depth; verify actual lossless codec before import.
        allowedFormats:
          type: array
          minItems: 1
          uniqueItems: true
          default: [flac, wav, m4a, mp3, aac, ogg, opus]
          items:
            type: string
            enum: [flac, wav, m4a, mp3, aac, ogg, opus]
        enabled:
          type: boolean
        users: &a2
          type: array
          items: *a1
        groups: *a2
        presentation:
          type: string
          enum:
            - separate
            - combined
        reviewTiming:
          type: string
          enum:
            - before
            - after
        default:
          $ref: "#/components/schemas/SoulseekRule"
        userRules:
          type: array
          items:
            $ref: "#/components/schemas/SoulseekRule"
        groupRules:
          type: array
          items:
            $ref: "#/components/schemas/SoulseekRule"
        sharing:
          type: string
          enum:
            - disabled
            - selected
            - imported
        shareFolders: *a2
        sharingError:
          type: string
          readOnly: true
    SoulseekDownloadPolicy:
      type: object
      description: Immutable policy captured when requesting audio. Missing on legacy requests, which retain unrestricted audio behavior.
      properties:
        losslessOnly:
          type: boolean
          default: true
          description: Require reported sample rate and bit depth; verify actual lossless codec before import.
        allowedFormats:
          type: array
          minItems: 1
          uniqueItems: true
          default: [flac, wav, m4a, mp3, aac, ogg, opus]
          items:
            type: string
            enum: [flac, wav, m4a, mp3, aac, ogg, opus]
    SoulseekAdminSettings:
      type: object
      properties:
        settings:
          $ref: "#/components/schemas/SoulseekSettings"
        configured:
          type: boolean
        writableRoots: *a2
        staging: *a1
    SoulseekFile:
      type: object
      properties:
        filename: *a1
        size:
          type: integer
          format: int64
        bitRate:
          type: integer
        sampleRate:
          type: integer
        bitDepth:
          type: integer
        length:
          type: integer
    SoulseekResult:
      allOf:
        - $ref: "#/components/schemas/SoulseekFile"
        - type: object
          properties:
            username: *a1
            folder: *a1
            queueLength:
              type: integer
            hasFreeUploadSlot:
              type: boolean
            uploadSpeed:
              type: integer
              format: int64
    SoulseekSearch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state: *a1
        results:
          type: array
          items:
            $ref: "#/components/schemas/SoulseekResult"
    SoulseekRequestFile:
      allOf:
        - $ref: "#/components/schemas/SoulseekFile"
        - type: object
          properties:
            transferId: *a1
            state: *a1
            bytesTransferred:
              type: integer
              format: int64
            placeInQueue:
              type: integer
    SoulseekRequest:
      type: object
      properties:
        downloadPolicy:
          $ref: "#/components/schemas/SoulseekDownloadPolicy"
        id:
          type: string
          format: uuid
        userId: *a1
        username: *a1
        folder: *a1
        files:
          type: array
          items:
            $ref: "#/components/schemas/SoulseekRequestFile"
        rule:
          $ref: "#/components/schemas/SoulseekRule"
        reviewTiming: *a1
        approved:
          type: boolean
        state:
          type: string
          enum:
            - review_before
            - queued
            - downloading
            - review_after
            - importing
            - imported
            - failed
            - blocked
            - cancelling
            - cancelled
            - rejected
            - deleted
        error: *a1
        batchId: *a1
        created:
          type: string
          format: date-time
        revision:
          type: integer
          format: int64
    SoulseekSelection:
      type: object
      required:
        - id
        - searchId
        - username
        - folder
      properties:
        id:
          type: string
          format: uuid
          description: Caller-generated idempotency key; repeating an owned ID returns the
            existing request.
        searchId: *a1
        username: *a1
        folder: *a1
        filenames: *a2
        album:
          type: boolean
          description: Fetch all supported audio files in this peer folder.
    SoulseekAction:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - approve
            - reject
            - cancel
            - retry
            - delete-staging
        libraryId: *a1
        folder: *a1
