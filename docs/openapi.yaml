  /admin/suggestions/accept-all:
    post:
      summary: Accept all pending changes in selected metadata fields
      description: Applies one transactional snapshot across all pages. The newest suggestion wins when a song has conflicting values for the same field.
      tags:
        - Administration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              additionalProperties: false
              properties:
                fields:
                  type: array
                  minItems: 1
                  maxItems: 9
                  items:
                    type: string
                    enum:
                      [
                        title,
                        artist,
                        album,
                        featuredArtists,
                        videoGuests,
                        albumArtist,
                        year,
                        genre,
                        number,
                        disc,
                        artwork,
                      ]
      responses:
        "200":
          description: All selected pending suggestions accepted atomically
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
