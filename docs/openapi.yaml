components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: cadence_session
  schemas:
    ArtistProfile:
      type: object
      properties:
        name:
          type: string
        mbid:
          type: string
        type:
          type: string
        country:
          type: string
        description:
          type: string
        biography:
          type: string
        image:
          type: string
        imageSource:
          type: string
        wikipedia:
          type: string
        warning:
          type: string
        updated:
          type: string
          format: date-time
        genres:
          type: array
          items:
            type: string
        links:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              url:
                type: string
                format: uri
    PlaybackCheckpoint:
      type: object
      required: [trackId, position, revision, writer, sequence]
      properties:
        trackId:
          type: string
          maxLength: 120
        position:
          type: number
          minimum: 0
          maximum: 172800
          description: Playback position in seconds
        revision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        writer:
          type: string
          pattern: "^([a-f0-9-]{16,64})?$"
        sequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Positive and increasing for saves; zero for an empty saved state
    OK:
      type: object
      properties:
        ok:
          type: boolean
    Error:
      type: object
      properties:
        error:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
          description: Unique lowercase sign-in name
        displayName:
          type: string
        admin:
          type: boolean
        groups:
          type: array
          items:
            type: string
        avatar:
          type: boolean
          description: Whether a stored avatar is available
        avatarVersion:
          type: integer
          format: int64
          description: Increases on avatar replacement or removal
    Session:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrf:
          type: string
    Track:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        albumArtist:
          type: string
          description: Omitted for singles.
        album:
          type: string
          description: Omitted when the song has no album.
        albumId:
          type: string
          description: Omitted for singles.
        single:
          type: boolean
          description: True when the song has no album metadata.
        year:
          type: string
        genre:
          type: string
        codec:
          type: string
        mime:
          type: string
        number:
          type: integer
        disc:
          type: integer
        duration:
          type: number
        artwork:
          type: boolean
        liked:
          type: boolean
    Page:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
    Album:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        tracks:
          type: integer
        coverId:
          type: string
    Artist:
      type: object
      properties:
        name:
          type: string
        tracks:
          type: integer
    Playlist:
      type: object
      properties:
        icon:
          type: string
          enum: [music, heart, headphones, disc, sparkles, moon]
        id:
          type: string
        name:
          type: string
    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Exclusion:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        kind:
          type: string
        target:
          type: string
    Suggestion:
      type: object
      properties:
        id:
          type: string
        trackId:
          type: string
        field:
          type: string
        value:
          type: string
        source:
          type: string
        status:
          type: string
        title:
          type: string
        current:
          type: string
    Scan:
      type: object
      properties:
        id:
          type: string
        started:
          type: string
          format: date-time
        finished:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        indexed:
          type: integer
        errors:
          type: array
          items:
            type: string
