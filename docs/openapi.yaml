openapi: 3.0.3
info:
  title: Cadence API
  version: 0.1.0
  license:
    name: GPL-2.0-or-later
    url: https://www.gnu.org/licenses/old-licenses/gpl-2.0.html
  description: Same-origin API. Authenticated mutations require X-CSRF-Token from
    /me or login. Excluded tracks return 404. Instance folders are configured by
    environment; music files are never modified.
servers:
  - url: /api/v1
paths:
  /status:
    get:
      summary: Instance setup status
      tags:
        - Music
      security: []
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  setupRequired:
                    type: boolean
                  name:
                    type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, or role rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /setup:
    post:
      summary: Create first administrator; available only before the first account exists
      tags:
        - Music
      security: []
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, or role rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Trimmed and normalized to lowercase; case-insensitive sign-in
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 120
                password:
                  type: string
                  minLength: 3
                  maxLength: 72
                  description: At least 3 Unicode characters; maximum 72 UTF-8 bytes
  /login:
    post:
      summary: Sign in; sets HttpOnly cadence_session cookie
      tags:
        - Music
      security: []
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, or role rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Trimmed and normalized to lowercase; case-insensitive sign-in
                password:
                  type: string
  /logout:
    post:
      summary: Revoke current session
      tags:
        - Music
      security:
        - session: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, or role rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
  /me:
    get:
      summary: Current account and CSRF token
      tags:
        - Music
      security:
        - session: []
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, or role rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update own display name
      tags:
        - Accounts
      security:
        - session: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, role, or current password rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User or avatar not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username/group conflict or concurrent password change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName:
                  type: string
                  description: Nonblank name up to 120 UTF-8 bytes; no newlines or null bytes.
              required:
                - displayName
  /me/password:
    post:
      summary: Change own password
      description: Requires current password. Keeps this session and revokes all other
        sessions atomically.
      tags:
        - Accounts
      security:
        - session: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, role, or current password rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User or avatar not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username/group conflict or concurrent password change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many password attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password: &a1
                  type: string
                  format: password
                  writeOnly: true
                  description: At least 3 Unicode characters, up to 72 UTF-8 bytes.
                currentPassword:
                  type: string
                  format: password
                  writeOnly: true
              required:
                - password
                - currentPassword
  /me/avatar:
    put:
      summary: Set avatar
      description: Accepts JPEG or PNG up to 2 MiB, 4096 pixels per side and 8 million
        pixels. Center-cropped, resized to at most 256 pixels, and re-encoded as
        JPEG.
      tags:
        - Accounts
      security:
        - session: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, role, or current password rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User or avatar not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username/group conflict or concurrent password change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Avatar exceeds 2 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
    delete:
      summary: Remove own avatar
      tags:
        - Accounts
      security:
        - session: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, role, or current password rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User or avatar not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username/group conflict or concurrent password change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{id}/avatar:
    get:
      summary: Read own avatar or another user avatar as administrator
      description: Authenticated JPEG image; private no-store response. Version
        parameter in client URLs changes after replacement/removal.
      tags:
        - Accounts
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: JPEG avatar
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, role, or current password rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User or avatar not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username/group conflict or concurrent password change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}:
    put:
      summary: Edit a user as administrator
      description: At least one field is required. Username, display name, and groups
        update atomically. Administrator status cannot be changed here.
      tags:
        - Accounts
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, role, or current password rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User or avatar not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username/group conflict or concurrent password change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username:
                  type: string
                  description: Unique sign-in name, normalized to lowercase and trimmed.
                displayName:
                  type: string
                  description: Nonblank name up to 120 UTF-8 bytes; no newlines or null bytes.
                groups:
                  type: array
                  maxItems: 100
                  items:
                    type: string
  /admin/users/{id}/password:
    post:
      summary: Reset a user password as administrator
      description: No current password required. Revokes every session, including this
        session if resetting your own account.
      tags:
        - Accounts
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, role, or current password rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User or avatar not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username/group conflict or concurrent password change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                password: *a1
              required:
                - password
  /admin/users/{id}/avatar:
    put:
      summary: Set avatar
      description: Accepts JPEG or PNG up to 2 MiB, 4096 pixels per side and 8 million
        pixels. Center-cropped, resized to at most 256 pixels, and re-encoded as
        JPEG.
      tags:
        - Accounts
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, role, or current password rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User or avatar not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username/group conflict or concurrent password change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Avatar exceeds 2 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
    delete:
      summary: Remove a user avatar as administrator
      tags:
        - Accounts
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, role, or current password rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User or avatar not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username/group conflict or concurrent password change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tracks:
    get:
      summary: Permission-filtered tracks
      tags:
        - Music
      security:
        - session: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: q
          in: query
          schema:
            type: string
        - name: album
          in: query
          schema:
            type: string
        - name: artist
          in: query
          schema:
            type: string
        - name: playlist
          in: query
          schema:
            type: string
        - name: collection
          in: query
          schema:
            type: string
            enum:
              - likes
              - history
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, or role rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tracks/{id}:
    get:
      summary: Visible track metadata
      tags:
        - Music
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, or role rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /albums:
    get:
      summary: Permission-filtered albums and counts
      tags:
        - Music
      security:
        - session: []
      parameters:
        - name: limit
