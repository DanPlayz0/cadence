components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: cadence_session
  schemas:
    OK:
      type: object
      properties:
        ok:
          type: boolean
    Error:
      type: object
      properties:
        error:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        admin:
          type: boolean
        groups:
          type: array
          items:
            type: string
    Session:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrf:
          type: string
    Track:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        albumArtist:
          type: string
        album:
          type: string
        albumId:
          type: string
        year:
          type: string
        genre:
          type: string
        codec:
          type: string
        mime:
          type: string
        number:
          type: integer
        disc:
          type: integer
        duration:
          type: number
        artwork:
          type: boolean
        liked:
          type: boolean
    Page:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
    Album:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        tracks:
          type: integer
        coverId:
          type: string
    Artist:
      type: object
      properties:
        name:
          type: string
        tracks:
          type: integer
    Playlist:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Exclusion:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        kind:
          type: string
        target:
          type: string
    Suggestion:
      type: object
      properties:
        id:
          type: string
        trackId:
          type: string
        field:
          type: string
        value:
          type: string
        source:
          type: string
        status:
          type: string
        title:
          type: string
        current:
          type: string
    Scan:
      type: object
      properties:
        id:
          type: string
        started:
          type: string
          format: date-time
        finished:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
        indexed:
          type: integer
        errors:
          type: array
          items:
            type: string
