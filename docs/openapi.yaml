openapi: 3.0.3
info:
  title: Cadence API
  version: 0.1.0
  license:
    name: GPL-2.0-or-later
    url: https://www.gnu.org/licenses/old-licenses/gpl-2.0.html
  description:
    Same-origin API. Authenticated mutations require X-CSRF-Token from
    /me or login. Mutation origins are restricted to PUBLIC_URL (or the request origin
    when unset) unless ALLOW_ANY_ORIGIN=true; this does not enable cross-origin CORS.
    Excluded tracks return 404. Mounted storage boundaries are configured by
    environment; library folders and sharing are configured in the UI. Existing music files are never modified. Optional Soulseek imports create new files in explicitly writable destinations.
servers:
  - url: /api/v1
paths:
  /sync:
    get:
      summary: Read per-user sync connections and health
      security:
        - session: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
        "400": { description: Invalid input or expired authorization }
        "401": { description: Sign in required }
        "403": { description: CSRF token or origin rejected }
        "404": { description: Resource not owned or accessible }
        "503": { description: Sync unavailable }
  /sync/lastfm/authorize:
    post:
      summary: Start a ten-minute Last.fm browser authorization
      security:
        - session: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncAuthorization"
        "400": { description: Invalid input or expired authorization }
        "401": { description: Sign in required }
        "403": { description: CSRF token or origin rejected }
        "404": { description: Resource not owned or accessible }
        "503": { description: Sync unavailable }
  /sync/lastfm/callback:
    get:
      summary: Consume account-bound Last.fm authorization and connect
      security:
        - session: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "303": { description: Connected; redirect to Songs }
        "400": { description: Invalid, expired, replayed, or failed authorization }
        "401": { description: Sign in required }
        "503": { description: Sync unavailable }
  /sync/listenbrainz/connect:
    post:
      summary: Validate and connect a ListenBrainz personal token
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncToken"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOK"
        "400": { description: Invalid input or expired authorization }
        "401": { description: Sign in required }
        "403": { description: CSRF token or origin rejected }
        "404": { description: Resource not owned or accessible }
        "503": { description: Sync unavailable }
  /sync/{provider}/preferences:
    put:
      summary: Set per-service sync preferences; cancel disabled pending categories
      security:
        - session: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [lastfm, listenbrainz] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPreferences"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOK"
        "400": { description: Invalid input or expired authorization }
        "401": { description: Sign in required }
        "403": { description: CSRF token or origin rejected }
        "404": { description: Resource not owned or accessible }
        "503": { description: Sync unavailable }
  /sync/{provider}:
    delete:
      summary: Disconnect and cancel unsent work
      security:
        - session: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [lastfm, listenbrainz] } }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOK"
        "400": { description: Invalid input or expired authorization }
        "401": { description: Sign in required }
        "403": { description: CSRF token or origin rejected }
        "404": { description: Resource not owned or accessible }
        "503": { description: Sync unavailable }
  /sync/listens:
    post:
      summary: Accept an idempotent qualified listen; snapshot accessible catalog metadata
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncEvent"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOK"
        "400": { description: Invalid input or expired authorization }
        "401": { description: Sign in required }
        "403": { description: CSRF token or origin rejected }
        "404": { description: Resource not owned or accessible }
        "503": { description: Sync unavailable }
  /sync/now-playing:
    post:
      summary: Send a transient now-playing notification without retries
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncEvent"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOK"
        "400": { description: Invalid input or expired authorization }
        "401": { description: Sign in required }
        "403": { description: CSRF token or origin rejected }
        "404": { description: Resource not owned or accessible }
        "503": { description: Sync unavailable }
  /sync/{provider}/exports/preview:
    get:
      summary: Preview verified history and excluded local plays
      security:
        - session: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [lastfm, listenbrainz] } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncExport"
        "400": { description: Invalid input or expired authorization }
        "401": { description: Sign in required }
        "403": { description: CSRF token or origin rejected }
        "404": { description: Resource not owned or accessible }
        "503": { description: Sync unavailable }
  /sync/{provider}/exports:
    post:
      summary: Explicitly queue verified history; plays preference must be enabled
      security:
        - session: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [lastfm, listenbrainz] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncExportRange"
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncExport"
        "400": { description: Invalid input or expired authorization }
        "401": { description: Sign in required }
        "403": { description: CSRF token or origin rejected }
        "404": { description: Resource not owned or accessible }
        "503": { description: Sync unavailable }
  /sync/exports/{id}:
    get:
      summary: Read owned export progress and first 25 rejected records
      security:
        - session: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncExport"
        "400": { description: Invalid input or expired authorization }
        "401": { description: Sign in required }
        "403": { description: CSRF token or origin rejected }
        "404": { description: Resource not owned or accessible }
        "503": { description: Sync unavailable }
  /soulseek/capabilities:
    get:
      summary: Read current user Soulseek capabilities
      security:
        - session: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoulseekCapabilities"
        "400":
          description: Invalid request or destination
        "401":
          description: Sign in required
        "403":
          description: Missing permission or CSRF token
        "404":
          description: Owned resource not found
        "409":
          description: Stale action or duplicate request ID
        "429":
          description: Search rate limit
        "502":
          description: Soulseek API failure
        "503":
          description: Optional integration unavailable
  /soulseek/searches:
    post:
      summary: Start an explicit external search
      security:
        - session: []
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoulseekSearch"
        "400":
          description: Invalid request or destination
        "401":
          description: Sign in required
        "403":
          description: Missing permission or CSRF token
        "404":
          description: Owned resource not found
        "409":
          description: Stale action or duplicate request ID
        "429":
          description: Search rate limit
        "502":
          description: Soulseek API failure
        "503":
          description: Optional integration unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  minLength: 3
                  maxLength: 200
  /soulseek/searches/{id}:
    get:
      summary: Poll an owned asynchronous search
      security:
        - session: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoulseekSearch"
        "400":
          description: Invalid request or destination
        "401":
          description: Sign in required
        "403":
          description: Missing permission or CSRF token
        "404":
          description: Owned resource not found
        "409":
          description: Stale action or duplicate request ID
        "429":
          description: Search rate limit
        "502":
          description: Soulseek API failure
        "503":
          description: Optional integration unavailable
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /soulseek/folder:
    post:
      summary: Fetch complete audio listing for a peer folder in an owned search
      security:
        - session: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SoulseekFile"
        "400":
          description: Invalid request or destination
        "401":
          description: Sign in required
        "403":
          description: Missing permission or CSRF token
        "404":
          description: Owned resource not found
        "409":
          description: Stale action or duplicate request ID
        "429":
          description: Search rate limit
        "502":
          description: Soulseek API failure
        "503":
          description: Optional integration unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - searchId
                - username
                - folder
              properties:
                searchId: &a1
                  type: string
                username: *a1
                folder: *a1
  /soulseek/requests:
    get:
      summary: List own requests; administrators list all requests
      security:
        - session: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SoulseekRequest"
        "400":
          description: Invalid request or destination
        "401":
          description: Sign in required
        "403":
          description: Missing permission or CSRF token
        "404":
          description: Owned resource not found
        "409":
          description: Stale action or duplicate request ID
        "429":
          description: Search rate limit
        "502":
          description: Soulseek API failure
        "503":
          description: Optional integration unavailable
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
    post:
      summary: Request selected songs or a complete album folder
      security:
        - session: []
      responses:
        "200":
          description: Existing request for this idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoulseekRequest"
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoulseekRequest"
        "400":
          description: Invalid request or destination
        "401":
          description: Sign in required
        "403":
          description: Missing permission or CSRF token
        "404":
          description: Owned resource not found
        "409":
          description: Stale action or duplicate request ID
        "429":
          description: Search rate limit
        "502":
          description: Soulseek API failure
        "503":
          description: Optional integration unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoulseekSelection"
  /soulseek/requests/{id}/actions:
    post:
      summary:
        Manage a request; approval, rejection, and staging deletion require
        administrator access
      security:
        - session: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoulseekRequest"
        "400":
          description: Invalid request or destination
        "401":
          description: Sign in required
        "403":
          description: Missing permission or CSRF token
        "404":
          description: Owned resource not found
        "409":
          description: Stale action or duplicate request ID
        "429":
          description: Search rate limit
        "502":
          description: Soulseek API failure
        "503":
          description: Optional integration unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoulseekAction"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /admin/soulseek:
    get:
      summary: Read administrator Soulseek settings without credentials
      security:
        - session: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoulseekAdminSettings"
        "400":
          description: Invalid request or destination
        "401":
          description: Sign in required
        "403":
          description: Missing permission or CSRF token
        "404":
          description: Owned resource not found
        "409":
          description: Stale action or duplicate request ID
        "429":
          description: Search rate limit
        "502":
          description: Soulseek API failure
        "503":
          description: Optional integration unavailable
    put:
      summary: Save permissions, routing, review, presentation, and sharing settings
      security:
        - session: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoulseekAdminSettings"
        "400":
          description: Invalid request or destination
        "401":
          description: Sign in required
        "403":
          description: Missing permission or CSRF token
        "404":
          description: Owned resource not found
        "409":
          description: Stale action or duplicate request ID
        "429":
          description: Search rate limit
        "502":
          description: Soulseek API failure
        "503":
          description: Optional integration unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SoulseekSettings"
  /libraries:
    get:
      summary: List accessible named libraries
      description: Returns IDs and names only. Administrators see all configured
        libraries; listeners see everyone, user, and group grants.
      security: &a1
        - session: []
      responses:
        "200":
          description: Accessible libraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibrarySummary"
        "401":
          description: Sign in required
        "500":
          description: Server failure
  /admin/libraries:
    get:
      summary: List library configuration
      security: *a1
      responses:
        "200":
          description: Libraries with folders and sharing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MusicLibrary"
        "401": &a2
          description: Sign in required
        "403": &a3
          description: Administrator required
        "500": &a4
          description: Server failure
    post:
      summary: Create a music library
      description: Requires administrator and CSRF. Choose one to 100 existing
        directories beneath MUSIC_ROOTS. Grants are saved atomically. New
        libraries default to administrator-only. Overlapping library grants add
        together; group exclusions still override them. Requests an incremental
        scan or coalesced follow-up.
      security: *a1
      parameters:
        - &a5
          name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody: &a6
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MusicLibraryInput"
      responses:
        "201":
          description: Created library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicLibrary"
        "400": &a7
          description: Invalid input or unavailable folder
        "401": *a2
        "403": *a3
        "404": &a8
          description: Library not found
        "409": &a9
          description: Invalid user/group reference
        "500": *a4
  /admin/libraries/{id}:
    put:
      summary: Replace library folders and sharing
      description:
        Requires administrator and CSRF. Access changes immediately. Folder
        and grant changes are atomic and request an incremental scan. Does not
        modify source files.
      security: *a1
      parameters:
        - &a10
          name: id
          in: path
          required: true
          schema:
            type: string
        - *a5
      requestBody: *a6
      responses:
        "200":
          description: Updated library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicLibrary"
        "400": *a7
        "401": *a2
        "403": *a3
        "404": *a8
        "409": *a9
        "500": *a4
    delete:
      summary: Remove a library and its sharing
      description:
        Source music, catalog records, overrides, playlists and history are
        retained. Tracks remain accessible if another library grants access.
      security: *a1
      parameters:
        - *a10
        - *a5
      responses:
        "200":
          description: Library removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        "401": *a2
        "403": *a3
        "404": *a8
        "500": *a4
  /admin/folders:
    get:
      summary: Browse immediate mounted directories before indexing
      description:
        Administrator only. Empty path lists configured MUSIC_ROOTS. Paths
        must be absolute directories within those roots. Parent traversal and
        escaping symlinks are rejected. Music files are omitted; no recursive walk
        is performed.
      security: *a1
      parameters:
        - name: path
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Directory page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MusicFolderPage"
        "400": *a7
        "401": *a2
        "403": *a3
        "500": *a4
  /me/playback:
    get:
      summary: Restore this account's last song and playback position
      description: Returns a null track when no checkpoint exists or the saved song is unavailable or excluded. Revision remains available for subsequent writes.
      security:
        - session: []
      responses:
        "200":
          description: Saved playback with the currently accessible track
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PlaybackCheckpoint"
                  - type: object
                    properties:
                      track:
                        nullable: true
                        allOf:
                          - $ref: "#/components/schemas/Track"
        "401":
          description: Sign in required
        "500":
          description: Server failure
    put:
      summary: Save this account's playback progress
      description: Requires X-CSRF-Token. Use a random writer ID per tab lifetime and increasing sequence numbers. Same-writer saves accept only newer sequences. A different writer must supply the current revision. Position is clamped to known song duration. Checkpoints do not record listening-history plays.
      security:
        - session: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PlaybackCheckpoint"
                - type: object
                  properties:
                    trackId:
                      type: string
                      minLength: 1
                    writer:
                      type: string
                      minLength: 16
                    sequence:
                      type: integer
                      minimum: 1
      responses:
        "200":
          description: Saved checkpoint with its new revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackCheckpoint"
        "400":
          description: Invalid checkpoint
        "401":
          description: Sign in required
        "403":
          description: CSRF or origin rejected
        "404":
          description: Song unavailable or excluded
        "409":
          description: Checkpoint superseded by a newer sequence or device revision
        "500":
          description: Server failure
  /status:
    get:
      summary: Instance setup status
      tags:
        - Music
      security: []
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  setupRequired:
                    type: boolean
                  name:
                    type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, or role rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /setup:
    post:
      summary: Create first administrator; available only before the first account exists
      tags:
        - Music
      security: []
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, or role rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Trimmed and normalized to lowercase; case-insensitive sign-in
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 120
                password:
                  type: string
                  minLength: 3
                  maxLength: 72
                  description: At least 3 Unicode characters; maximum 72 UTF-8 bytes
  /login:
    post:
      summary: Sign in; sets HttpOnly cadence_session cookie
      tags:
        - Music
      security: []
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: CSRF, origin, or role rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found or excluded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
