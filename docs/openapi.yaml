  /tracks/{id}/stream:
    get:
      summary: Original or converted audio; supports byte ranges
      tags:
        - Music
      security:
        - session: []
      parameters:
        - name: quality
          in: query
          schema:
            type: string
            enum:
              - original
              - high
              - saver
            default: original
        - name: Range
          in: header
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complete audio; transcoding completes before serving
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "206":
          description: Partial audio range
        "400":
          description: Invalid request
          content:
            application/json:
