<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141514" />
    <title>Cadence · Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #141514;
        color: #eeefea;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      img {
        border-radius: 1.5rem;
      }
      p {
        color: #a4aa9f;
      }
      a {
        display: inline-block;
        padding: 0.65rem 1.2rem;
        background: #dfaa71;
        color: #141514;
        border-radius: 0.5rem;
        text-decoration: none;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 3px solid #eeefea;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="80" height="80" alt="" />
      <h1>You're offline</h1>
      <p>
        Connect to your Cadence server to open your library. Music isn't
        downloaded for offline use. Recently cached songs can keep playing in a
        tab that's already open.
      </p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
