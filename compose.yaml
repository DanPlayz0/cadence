services:
  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://cadence:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cadence?sslmode=disable
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      PUBLIC_URLS: ${PUBLIC_URLS:-}
      ALLOW_ANY_ORIGIN: ${ALLOW_ANY_ORIGIN:-false}
      TRANSCODE_WORKERS: ${TRANSCODE_WORKERS:-2}
      TRANSCODE_CACHE_MB: ${TRANSCODE_CACHE_MB:-2048}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-60}
      METADATA_USER_AGENT: ${METADATA_USER_AGENT:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_API_SECRET: ${LASTFM_API_SECRET:-}
      # Optional external slskd; the bundled override supplies its own connection.
      SLSKD_URL: ${SLSKD_URL:-}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      SLSKD_USERNAME: ${SLSKD_USERNAME:-cadence}
      SLSKD_PASSWORD: ${SLSKD_PASSWORD:-}
      SOULSEEK_STAGING_DIR: /soulseek-staging
      SOULSEEK_WRITABLE_ROOTS: ${SOULSEEK_WRITABLE_ROOTS:-}
    # Optional host mount; unset MUSIC_PATH starts with empty Docker-managed storage.
    # Choose library folders and sharing in the web UI after mounting storage.
    volumes:
      - "${MUSIC_PATH:-music_storage}:/music:ro"
      - app_data:/data
      # External slskd: mount its completed-download directory here.
      - "${SOULSEEK_STAGING_PATH:-soulseek_staging}:/soulseek-staging"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadence
      POSTGRES_DB: cadence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  music_storage:
  postgres_data:
  app_data:
  soulseek_staging:
